name: Bug Report
description: Report a crash, wrong output, or other unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!
        Please fill this out as completely as you can so the issue is easier to reproduce.

  - type: input
    id: mod_version
    attributes:
      label: Mod version
      description: Better /help version you are using
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: mc_version
    attributes:
      label: Minecraft version
      description: Game version you are using
      placeholder: "e.g. 26.2"
    validations:
      required: true

  - type: dropdown
    id: mod_loader
    attributes:
      label: Mod loader
      options:
        - Fabric
        - NeoForge
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Singleplayer / Integrated server
        - Dedicated server
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: What should someone do to see the bug?
      placeholder: |
        1. Run `/help`
        2. Click next page
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the exact `/help` input if relevant.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: |
        Paste relevant log lines, or attach screenshots / log files.
        For crashes, the full crash report or latest.log helps a lot.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Other mods involved, or anything else that might matter.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I am using the latest Better /help build available for my game version
          required: true
        - label: I searched existing issues and did not find a duplicate
          required: true
